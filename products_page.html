<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGAZ</title>
    <link rel="stylesheet" href="product_page.css">
    <link rel="stylesheet" href="filter.css">
</head>
<body>
    <header id="head">
        <h2>MAGAZ</h2>
        
        <div class="contacts-block">
            <div class="contact-row">
                <img class="header_icon" src="./image/phone_icon.png" alt="телефон">
                <p>+7 (999) 999-99-99</p>
            </div>
            <div class="contact-row">
                <img class="header_icon" src="./image/email_icon.png" alt="почта">
                <p>email3@gmail.com</p>
            </div>
            <div class="contact-row">
                <img class="header_icon" src="./image/geo_icon.png" alt="адрес">
                <p>г. Самара, ул. Некрасовская, д. 43</p>
            </div>
        </div>
    </header>
    
    <main id="main">
        <section class="serch_filtor">
            <a href="account_page.html"><img class="account_icon" src="./image/account_icon.png" alt="аккаунт"></a>
            <a href="card_page.html"><img class="cart_icon" src="./image/cart_icon.png" alt="корзина"></a>
            <p id="basket-count"></p>

            <input id='serch_input' placeholder="поиск..."/>

            <img class="search_icon" id="save_search" src="./image/search_icon.png" alt="поиск">
            <img class="filter_icon" id="filter" src="./image/filter_icon.png" alt="фильтр">
        </section>

        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Фильтры</h2>

                <ul class="custom-list">
                    <li class="filter-group">
                        <h3>1. По категории</h3>
                        <div class="options">
                            <label class="option" id="type">
                                <input type="checkbox" name="type" value="Ноутбук">
                                <span>Ноутбуки</span>
                            </label>
                            <label class="option">
                                <input type="checkbox" name="type" value="Планшет">
                                <span>Планшеты</span>
                            </label>
                            <label class="option">
                                <input type="checkbox" name="type" value="Телефон">
                                <span>Телефоны</span>
                            </label>
                        </div>
                    </li>

                    <li class="filter-group">
                        <h3>2. По бренду</h3>
                        <div class="options">
                            <label class="option" id="brand">
                                <input type="checkbox" name="brand" value="Apple">
                                <span>Apple</span>
                            </label>
                            <label class="option">
                                <input type="checkbox" name="brand" value="Samsung">
                                <span>Samsung</span>
                            </label>
                            <label class="option">
                                <input type="checkbox" name="brand" value="Xiaomi">
                                <span>Xiaomi</span>
                            </label>
                            <label class="option">
                                <input type="checkbox" name="brand" value="Asus">
                                <span>Asus</span>
                            </label>
                            <label class="option">
                                <input type="checkbox" name="brand" value="Lenovo">
                                <span>Lenovo</span>
                            </label>
                        </div>
                    </li>

                    <li class="filter-group">
                        <h3>3. По цене</h3>
                        <p style="color:rgb(180, 180, 180);">* Введите максимальную цену</p>
                        <input id="input_price" placeholder="Введите цену" class="price-input">
                    </li>

                    <button id="filt_btn" class="filtbtn">Применить</button>
                </ul>
            </div>
        </div>

        <div id="productModal" class="product-modal">
            <div class="product-modal-content">
                <span class="product-modal-close">&times;</span>
                <div class="product-modal-body">
                    <img id="modal_img" src="" alt="Товар">
                    <div class="product-modal-info">
                        <h2 id="modal_name"></h2>
                        <p class="modal-brand" id="modal_brand"></p>
                        <p class="modal-price" id="modal_price"></p>
                        <p class="modal-desc" id="modal_desc"></p>
                    </div>
                </div>
            </div>
        </div>

            <div class="product-grid" id="products_container"></div>
    </main>

    <footer>
        <h2>MAGAZ</h2>
        <div>
            <h3>Пукупателям</h3>
            <ul>
                <li><a href="#main">Главная</a></li>
                <li><a href="#main">Товары</a></li>
                <li><a href="#head">Контакты</a></li>
            </ul>
        </div>
    </footer>

    <script type="module" src="product_psge.js" defer></script>
</body>
</html>
